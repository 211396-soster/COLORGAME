name: Godot project check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Show Godot version
        run: godot --version
      - name: Import project in headless editor
        run: godot --headless --editor --path . --quit
