name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - "data/**"
      - "scenes/**"
      - "scripts/**"
      - "tools/download_realism_assets.py"
      - "tools/download_realistic_models.py"
      - "scripts/real_assets.gd"
      - "tex/**"
      - "icon.svg"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download CC0 PBR textures
        run: python tools/download_realism_assets.py

      - name: Download CC0 3D models
        run: python tools/download_realistic_models.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ColorTintas.apk
          test -s build/ColorTintas.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorTintas-Android-APK
          path: build/ColorTintas.apk
          if-no-files-found: error
          retention-days: 14
